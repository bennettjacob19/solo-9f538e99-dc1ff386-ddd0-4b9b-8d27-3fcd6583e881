services:
  prefix-drill:
    build:
      context: .
      dockerfile: Dockerfile
    image: prefix-path-drill:1.0.0
    container_name: prefix-path-drill
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: "no"
